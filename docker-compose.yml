services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
    ports:
      - "1433:1433"
    volumes:
      - hotel-db:/var/opt/mssql
    restart: unless-stopped

  api:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=database,1433;Database=HotelBookingDb;User Id=sa;Password=${DB_PASSWORD:?Set DB_PASSWORD in .env};TrustServerCertificate=True"
      Jwt__Key: "${JWT_SECRET:?Set JWT_SECRET in .env}"
      SeedAdmin__FullName: "${ADMIN_NAME:-Hotel Administrator}"
      SeedAdmin__Email: "${ADMIN_EMAIL:-admin@hotel.example}"
      SeedAdmin__Password: "${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}"
      Cors__AllowedOrigins__0: "${FRONTEND_URL:-http://localhost:3000}"
      Swagger__Enabled: "true"
    ports:
      - "8080:8080"
    depends_on:
      - database
    restart: on-failure

volumes:
  hotel-db:
